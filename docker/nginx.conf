# nginx inside the container: plain HTTP on :8080. TLS terminates on the host nginx, which proxies here.
worker_processes 2;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 512; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    sendfile on;
    client_body_temp_path /tmp/nx_body;
    proxy_temp_path       /tmp/nx_proxy;
    fastcgi_temp_path     /tmp/nx_fcgi;
    uwsgi_temp_path       /tmp/nx_uwsgi;
    scgi_temp_path        /tmp/nx_scgi;
    client_max_body_size 1m;

    # DropCalc binds the login token to the client IP: take it from the host nginx (X-Forwarded-For).
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;

    gzip on;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml;

    server {
        listen 8080;
        root /var/www/dropcalc;
        index index.php;

        if ($request_method !~ ^(GET|HEAD|POST)$) { return 405; }

        # never serve dot-files, SQL, docs, scripts, docker files, templates
        location ~ /\. { return 404; }
        location ~* \.(sql|md|example|sh|yml|yaml|conf|ini|log|bak|inc)$ { return 404; }
        location ~ ^/(sql|docs|scripts|docker)/ { return 404; }

        # public mirror: admin / editing pages are not available
        location ~ ^/(install|import[a-z]*|servertools|settings2?|dbutils|delete|cpasswd|acc-change|acc-notes|bana|export|check)\.php$ { return 404; }

        location / { try_files $uri $uri/ =404; }

        location ~ \.php$ {
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT   $realpath_root;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_read_timeout 30s;
        }
    }
}
