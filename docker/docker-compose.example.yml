# Copy next to your checkout, adjust paths/addresses. Start: docker compose up -d --build
# Update the code: "git pull" in the checkout (no rebuild needed).
services:
  dropcalc:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: dropcalc-public:latest
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 256m
    volumes:
      - /var/www/info.wolfempire.net:/var/www/dropcalc:ro                       # git checkout
      - /etc/dropcalc/config.public.php:/var/www/dropcalc/config.php:ro         # public config (pepper, DB passwords)
    ports:
      - "127.0.0.1:8081:8080"          # host nginx proxies https://info... -> http://127.0.0.1:8081
    networks:
      dropcalc:
        ipv4_address: 172.28.0.10      # fixed address: MariaDB user is limited to it

networks:
  dropcalc:
    ipam:
      config:
        - subnet: 172.28.0.0/24
          gateway: 172.28.0.1
