# DropCalc (PHP 8 / L2JMobius) -- nginx config for info.wolfempire.net
#
# Put it in /etc/nginx/sites-available/info.wolfempire.net.conf and symlink it to
# sites-enabled. Assumptions, change them if yours differ:
#   web root          /var/www/info.wolfempire.net      (DropCalc files, index.php inside)
#   PHP-FPM socket    /run/php/php8.3-fpm.sock          (Ubuntu 24.04 default)
#   TLS certificate   /etc/letsencrypt/live/info.wolfempire.net/   (certbot)
#
# No certificate yet? Start with only the first server block (port 80), run
#   certbot certonly --webroot -w /var/www/certbot -d info.wolfempire.net
# and then enable the second block (port 443).

# Request limits per client IP. This file is included inside http{}, so these are allowed here.
limit_req_zone $binary_remote_addr zone=dc_general:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=dc_auth:10m    rate=60r/m;

server {
    listen 80;
    listen [::]:80;
    server_name info.wolfempire.net;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # On nginx >= 1.25.1 you may replace "ssl http2" by "ssl;" plus a separate "http2 on;".
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name info.wolfempire.net;

    root /var/www/info.wolfempire.net;
    index index.php;

    access_log /var/log/nginx/info.wolfempire.net.access.log;
    error_log  /var/log/nginx/info.wolfempire.net.error.log warn;

    # ---- TLS ----
    ssl_certificate     /etc/letsencrypt/live/info.wolfempire.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/info.wolfempire.net/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ---- headers (no add_header inside locations below: nginx would drop these) ----
    # While testing, lower HSTS to e.g. max-age=300.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    server_tokens off;

    # ---- behind Cloudflare or another proxy? ----
    # DropCalc binds the login token to $_SERVER['REMOTE_ADDR']. Behind a proxy that would be
    # the proxy's address, so tell nginx where the real one is (fill in the proxy ranges):
    # set_real_ip_from 173.245.48.0/20;     # https://www.cloudflare.com/ips-v4 and ips-v6
    # real_ip_header   CF-Connecting-IP;

    client_max_body_size 1m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_vary on;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml;

    if ($request_method !~ ^(GET|HEAD|POST)$) {
        return 405;
    }

    # ---- PHP-FPM settings shared by the PHP locations below ----
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
    fastcgi_param DOCUMENT_ROOT   $realpath_root;
    fastcgi_param HTTP_PROXY      "";
    fastcgi_buffer_size 32k;
    fastcgi_buffers 16 16k;
    fastcgi_send_timeout 60s;
    # Server Utilities -> Import (skills, recipes, buylists, spawns) work through a whole
    # datapack in one request.
    fastcgi_read_timeout 300s;

    # ---- never serve these (regex locations are tried in this order) ----
    location ~ /\.(?!well-known/) {
        return 404;
    }
    location ~ ^/(sql|docs)/ {
        return 404;
    }
    location ~* \.(sql|md|example|ini|log|bak|orig|rej|dist|conf|gdf)$ {
        return 404;
    }
    location = /readme.txt {
        return 404;
    }
    # PHP files that other pages only include
    location ~ ^/(config|config-read|common|skin|skincols|mysql_compat|xmlparse_common|map|playermap|authsendemail)\.php$ {
        return 404;
    }
    location ~ ^/lang-[a-z]+\.php$ {
        return 404;
    }
    # skin folders (0, 1, 2, 3): only CSS and images are public, their PHP is included by skin.php
    location ~ ^/[0-9]+/.*\.php$ {
        return 404;
    }

    # ---- static files ----
    location ^~ /images/ {
        expires 30d;
        access_log off;
        location ~ \.php$ {
            return 403;
        }
        try_files $uri =404;
    }
    location ~* \.(?:css|js|gif|jpe?g|png|ico|svg|bmp)$ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    # ---- PHP ----
    # Login, registration and password pages: stricter limit against password guessing.
    location ~ ^/(index|register|registerreset|cpasswd)\.php$ {
        limit_req zone=dc_auth burst=10 nodelay;
        limit_req_status 429;
        try_files $uri =404;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }
    location ~ \.php$ {
        limit_req zone=dc_general burst=40 nodelay;
        limit_req_status 429;
        try_files $uri =404;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    # DropCalc has no front controller: a path is either a file or a 404.
    location / {
        try_files $uri $uri/ =404;
    }
}
